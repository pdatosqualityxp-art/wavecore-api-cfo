name: Keep Render Service Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Ejecuta el ping cada 14 minutos
  workflow_dispatch: # Permite probarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render
        run: |
          curl -I https://wavecore-api-cfo.onrender.com/api/health